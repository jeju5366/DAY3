<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 날씨 맞춤 여행 추천</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Malgun Gothic", sans-serif; background: #eef6f7; color: #1d2b2e; }
        #app { max-width: 720px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
        header { padding: 16px; }
        h1 { margin: 0; font-size: 20px; }
        .sub { color: #5d7478; font-size: 13px; margin-top: 4px; }
        #chat { flex: 1; overflow-y: auto; padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
        .user { align-self: flex-end; background: #2a9d8f; color: #fff; border-bottom-right-radius: 4px; }
        .bot { align-self: flex-start; background: #fff; border-bottom-left-radius: 4px; box-shadow: 0 1px 3px #0001; }
        .steps { align-self: flex-start; display: flex; flex-direction: column; gap: 4px; max-width: 95%; }
        .step { font-size: 12.5px; padding: 5px 10px; border-radius: 10px; background: #dcefee; color: #24605a; }
        .step.err { background: #fbe0dd; color: #8a2d22; }
        .chips { padding: 8px 16px 0; display: flex; gap: 6px; flex-wrap: wrap; }
        .chips button { border: 1px solid #b9d6d3; background: #fff; border-radius: 14px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
        form { display: flex; gap: 8px; padding: 12px 16px 16px; }
        input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #b9d6d3; border-radius: 12px; }
        form button { padding: 0 18px; border: 0; border-radius: 12px; background: #2a9d8f; color: #fff; font-size: 16px; cursor: pointer; }
        form button:disabled { background: #9cc9c4; cursor: default; }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>🌴 제주 날씨 맞춤 여행 추천</h1>
            <div class="sub">날씨(Open-Meteo)와 관광지 목록을 AI가 직접 확인하고 추천해줘요</div>
        </header>
        <div id="chat"></div>
        <div class="chips" id="chips"></div>
        <form id="form">
            <input id="input" placeholder="예) 내일 서쪽에서 갈 만한 곳 추천해줘" autocomplete="off" maxlength="500">
            <button id="send">보내기</button>
        </form>
    </div>

    <script>
        const chat = document.getElementById("chat")
        const input = document.getElementById("input")
        const send = document.getElementById("send")
        const history = [] // {role: "user" | "model", text}

        const EXAMPLES = ["오늘 제주시에서 뭐 하지?", "내일 동쪽 여행 갈 건데 추천해줘", "비 오면 서귀포에서 어디 가?"]
        EXAMPLES.forEach((q) => {
            const b = document.createElement("button")
            b.type = "button"; b.textContent = q
            b.onclick = () => { input.value = q; document.getElementById("form").requestSubmit() }
            document.getElementById("chips").appendChild(b)
        })

        const scroll = () => { chat.scrollTop = chat.scrollHeight }

        const addMsg = (cls, text) => {
            const div = document.createElement("div")
            div.className = "msg " + cls
            // **굵게** 만 지원 (먼저 textContent 로 안전하게 넣고 노드를 쪼개서 처리)
            text.split(/\*\*(.+?)\*\*/g).forEach((part, i) => {
                if (i % 2) { const s = document.createElement("strong"); s.textContent = part; div.appendChild(s) }
                else div.appendChild(document.createTextNode(part))
            })
            chat.appendChild(div); scroll()
            return div
        }

        // 도구 호출 기록을 한 줄 요약으로 보여줌
        const describeStep = (s) => {
            const r = s.result || {}
            if (r.error) return ["err", `⚠️ ${s.name}: ${r.error}`]
            if (s.name === "get_weather") {
                const d = r.daily && r.daily[0]
                return ["", `🌤️ ${r.area} 날씨 확인` + (d ? ` — ${d.날씨}, ${d.최저기온_C}~${d.최고기온_C}°C, 강수확률 ${d.강수확률_퍼센트}%` : "")]
            }
            if (s.name === "find_spots") {
                const where = s.args.indoor === true ? "실내" : s.args.indoor === false ? "야외" : "전체"
                return ["", `📍 ${s.args.area} ${where} 관광지 검색 — ${r.count}곳`]
            }
            return ["", `🔧 ${s.name}`]
        }

        document.getElementById("form").onsubmit = async (e) => {
            e.preventDefault()
            const text = input.value.trim()
            if (!text) return
            input.value = ""
            document.getElementById("chips")?.remove()
            addMsg("user", text)
            history.push({ role: "user", text })

            send.disabled = true
            const wait = addMsg("bot", "날씨랑 관광지 확인하는 중... 🔍")
            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: history })
                })
                if (!res.ok) throw new Error(await res.text())
                const { reply, steps } = await res.json()
                wait.remove()
                if (steps.length) {
                    const box = document.createElement("div")
                    box.className = "steps"
                    steps.forEach((s) => {
                        const [cls, label] = describeStep(s)
                        const el = document.createElement("div")
                        el.className = "step " + cls; el.textContent = label
                        box.appendChild(el)
                    })
                    chat.appendChild(box)
                }
                addMsg("bot", reply)
                history.push({ role: "model", text: reply })
            } catch (err) {
                wait.remove()
                addMsg("bot", "😢 오류가 났어요: " + err.message)
                history.pop() // 실패한 질문은 기록에서 빼서 다시 보낼 수 있게
            } finally {
                send.disabled = false
                input.focus()
            }
        }

        addMsg("bot", "안녕하세요! 🌊 언제, 어느 쪽(동쪽·서쪽·서귀포·제주시)에서 놀 계획인지 알려주시면 날씨 보고 맞춤으로 추천해드릴게요.")
    </script>
</body>
</html>
